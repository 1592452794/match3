<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff9ec7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="消消乐">
<title>消消乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#ffe0ee;font-family:-apple-system,"PingFang SC",sans-serif;user-select:none}
  #topbar{position:fixed;top:0;left:0;right:0;height:60px;background:linear-gradient(135deg,#ff9ec7 0%,#ffb8d5 50%,#cfa8ff 100%);box-shadow:0 4px 18px rgba(255,155,195,0.5);z-index:5;display:flex;flex-direction:column;justify-content:center;padding:6px 14px;color:#fff}
  #topbar .row1{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:2px}
  #topbar .row2{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;opacity:0.95}
  #topbar .badge{background:rgba(255,255,255,0.28);padding:1px 8px;border-radius:8px;font-size:11px}
  #board{position:fixed;top:60px;left:0;right:0;bottom:0;display:block}
  #overlay{position:fixed;inset:0;background:rgba(255,180,210,0.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  #overlay.hidden{display:none}
  #overlay-content{background:linear-gradient(160deg,#fffafc 0%,#fff0f7 100%);border-radius:26px;padding:30px 26px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(255,120,170,0.35),0 0 0 2px rgba(255,200,225,0.6) inset}
  #overlay-content h2{color:#ff6ba5;font-size:19px;line-height:1.5;margin-bottom:14px;white-space:pre-line;font-weight:800}
  #overlay-content p{color:#a06b85;font-size:14px;line-height:1.6;margin-bottom:20px;white-space:pre-line}
  #overlay-content button{background:linear-gradient(135deg,#ff8fb8 0%,#cfa8ff 100%);color:#fff;border:none;border-radius:16px;padding:13px 36px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(255,140,180,0.45);letter-spacing:1px}
</style>
</head>
<body>
<div id="topbar">
  <div class="row1">
    <span id="level">第 1 关</span>
    <span id="title" class="badge">练气期 · 第 1 层</span>
  </div>
  <div class="row2">
    <span id="time">⏱ 150s</span>
    <span id="remaining">剩 64</span>
    <span id="score">分 0</span>
  </div>
</div>
<canvas id="board"></canvas>
<div id="overlay" class="hidden">
  <div id="overlay-content">
    <h2 id="ov-title">恭喜！</h2>
    <p id="ov-desc"></p>
    <button id="ov-btn">继续</button>
  </div>
</div>
<script>
// ===== 音效引擎 =====
let audioCtx = null;
let audioUnlocked = false;

function unlockAudio(){
  if(audioUnlocked) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioUnlocked = true;
    startBGM();
  }catch(e){}
}

function playTone(freq, duration, type='sine', volume=0.15, when=0){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}

function playMatchSound(chain){
  const freq = 520 + (chain-1) * 120;
  playTone(freq, 0.15, 'sine', 0.18);
  playTone(freq*1.5, 0.12, 'sine', 0.12, 0.06);
}
function playSwapSound(){ playTone(400, 0.08, 'triangle', 0.1); }
function playWinSound(){
  playTone(659, 0.12, 'sine', 0.2);
  playTone(784, 0.12, 'sine', 0.2, 0.1);
  playTone(988, 0.15, 'sine', 0.2, 0.2);
  playTone(1318, 0.4, 'sine', 0.2, 0.33);
}
function playLoseSound(){
  playTone(330, 0.2, 'sawtooth', 0.12);
  playTone(220, 0.35, 'sawtooth', 0.12, 0.15);
}
function playShuffleSound(){
  playTone(500, 0.1, 'triangle', 0.1);
  playTone(700, 0.1, 'triangle', 0.1, 0.08);
  playTone(900, 0.15, 'triangle', 0.1, 0.16);
}

// ===== 7 段不同风格的背景音乐 =====
const BGM_STYLES = [
  { notes: [523,587,659,784,880,784,659,587,523,659,784,1046,880,784,659,587], tempo: 380, wave: 'sine' },
  { notes: [440,523,587,659,587,523,494,440,392,440,494,523,494,440,392,330], tempo: 440, wave: 'triangle' },
  { notes: [659,784,880,784,659,587,659,784,880,1046,880,784,659,587,523,587], tempo: 300, wave: 'sine' },
  { notes: [523,659,784,659,523,440,523,659,784,880,784,659,587,523,440,523], tempo: 420, wave: 'triangle' },
  { notes: [587,698,880,698,587,523,587,698,880,1046,880,698,587,523,466,523], tempo: 400, wave: 'sine' },
  { notes: [784,880,1046,880,784,698,784,880,1046,1174,1046,880,784,698,659,698], tempo: 360, wave: 'triangle' },
  { notes: [523,587,698,784,698,587,523,440,523,698,784,880,784,698,587,523], tempo: 340, wave: 'sine' },
];

let bgmTimer = null;
let bgmPlaying = false;
let bgmStyleIndex = 0;

function startBGM(){
  if(bgmPlaying || !audioCtx) return;
  bgmPlaying = true;
  bgmStyleIndex = (level - 1) % BGM_STYLES.length;
  const style = BGM_STYLES[bgmStyleIndex];
  const notes = style.notes;
  let i = 0;
  function tick(){
    if(!bgmPlaying) return;
    const note = notes[i % notes.length];
    playTone(note, style.tempo/1000 * 0.9, style.wave, 0.06);
    playTone(note/2, style.tempo/1000 * 0.9, 'triangle', 0.03);
    i++;
    bgmTimer = setTimeout(tick, style.tempo);
  }
  tick();
}

function stopBGM(){
  bgmPlaying = false;
  if(bgmTimer) clearTimeout(bgmTimer);
  bgmTimer = null;
}

// ===== 修真境界 =====
function getCultivationTitle(lv){
  let stage, layer;
  if(lv <= 9){ stage = '练气期'; layer = lv; }
  else if(lv <= 18){ stage = '筑基期'; layer = lv - 9; }
  else if(lv <= 27){ stage = '金丹期'; layer = lv - 18; }
  else { stage = '元婴期'; layer = lv - 27; }
  return { stage, layer };
}

function getWinReward(lv){
  if(lv <= 9) return '获得 「灵光护体」 ✨';
  if(lv <= 18) return '凝聚 「真气根基」 💎';
  if(lv <= 27) return '引动 「天地异象」 🌟';
  return '元婴出窍，一步登仙 🌸';
}

function isBossLevel(lv){
  return lv === 9 || lv === 18 || lv === 27;
}

// ===== 游戏主体 =====
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const COLS = 8, ROWS = 8;
const COLORS_NORMAL = ['#ff9ec7','#ffd86b','#8ee8b0','#8ec5ff','#ffb87a','#cfa8ff'];
const COLORS_BOSS = ['#ff9ec7','#ffd86b','#8ee8b0','#8ec5ff','#ffb87a','#cfa8ff','#ff5c9e'];
let COLORS = COLORS_NORMAL;

let board = [];
let cellSize = 0;
let offsetX = 0, offsetY = 0;
let selected = null;
let score = 0, moves = 24, level = 1;
let timeLeft = 150;
let timerId = null;
let gameOver = false;
let busy = false;
let particles = [];
let fireworksActive = false;

// 背景星星（随机一次，之后固定）
const stars = [];
for(let i=0;i<28;i++){
  stars.push({
    x: Math.random(),
    y: Math.random(),
    r: 0.8 + Math.random() * 1.8,
    a: 0.25 + Math.random() * 0.4
  });
}

function getLevelConfig(lv){
  const boss = isBossLevel(lv);
  let timeLimit = Math.max(70, 150 - (lv - 1) * 2);
  if(boss) timeLimit = Math.floor(timeLimit * 0.82);
  let movesLimit = Math.max(14, 24 - Math.floor((lv - 1) / 3));
  if(boss) movesLimit = Math.max(12, movesLimit - 2);
  return { time: timeLimit, moves: movesLimit, boss };
}

function easeOutQuad(t){ return 1 - (1-t)*(1-t); }
function randColor(){ return Math.floor(Math.random()*COLORS.length); }

function resize(){
  const topH = 60;
  const w = window.innerWidth;
  const h = window.innerHeight - topH;

  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.top = topH + 'px';

  canvas.width = Math.floor(w * devicePixelRatio);
  canvas.height = Math.floor(h * devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  cellSize = Math.floor(Math.min((w - 60) / COLS, (h - 60) / ROWS));
  offsetX = (w - cellSize * COLS) / 2;
  offsetY = (h - cellSize * ROWS) / 2;

  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 300));

function makeTile(color, row, col){
  return {
    color,
    row,
    col,
    displayRow: row,
    displayCol: col,
    scale: 1,
    clearProgress: 0
  };
}

function initBoard(){
  board = [];
  for(let r=0;r<ROWS;r++){
    board[r] = [];
    for(let c=0;c<COLS;c++){
      let color;
      let tries = 0;
      do {
        color = randColor();
        tries++;
      } while (tries < 50 && (
        (c >= 2 && board[r][c-1] && board[r][c-2] &&
         board[r][c-1].color === color && board[r][c-2].color === color) ||
        (r >= 2 && board[r-1][c] && board[r-2][c] &&
         board[r-1][c].color === color && board[r-2][c].color === color)
      ));
      board[r][c] = makeTile(color, r, c);
    }
  }
}

function findMatches(){
  const marks = new Set();
  for(let r=0;r<ROWS;r++){
    let run = 1;
    for(let c=1;c<=COLS;c++){
      const curr = c < COLS ? board[r][c] : null;
      const prev = board[r][c-1];
      if(curr && prev && curr.color === prev.color) run++;
      else {
        if(run >= 3) for(let k=c-run;k<c;k++) marks.add(r+','+k);
        run = 1;
      }
    }
  }
  for(let c=0;c<COLS;c++){
    let run = 1;
    for(let r=1;r<=ROWS;r++){
      const curr = r < ROWS ? board[r][c] : null;
      const prev = board[r-1][c];
      if(curr && prev && curr.color === prev.color) run++;
      else {
        if(run >= 3) for(let k=r-run;k<r;k++) marks.add(k+','+c);
        run = 1;
      }
    }
  }
  return [...marks].map(s => s.split(',').map(Number));
}

function applyGravity(){
  const falls = [];
  for(let c=0;c<COLS;c++){
    let writeRow = ROWS - 1;
    for(let r=ROWS-1;r>=0;r--){
      const t = board[r][c];
      if(t){
        if(r !== writeRow){
          board[writeRow][c] = t;
          board[r][c] = null;
          t.row = writeRow;
          falls.push({ tile: t, from: t.displayRow, to: writeRow });
        }
        writeRow--;
      }
    }
  }
  return falls;
}

function countRemaining(){
  let n = 0;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      if(board[r][c]) n++;
  return n;
}

function hasMoves(){
  function swapTmp(a, b){
    const t = board[a[0]][a[1]];
    board[a[0]][a[1]] = board[b[0]][b[1]];
    board[b[0]][b[1]] = t;
  }
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(!board[r][c]) continue;
      if(c+1<COLS && board[r][c+1]){
        swapTmp([r,c],[r,c+1]);
        const ok = findMatches().length > 0;
        swapTmp([r,c],[r,c+1]);
        if(ok) return true;
      }
      if(r+1<ROWS && board[r+1][c]){
        swapTmp([r,c],[r+1,c]);
        const ok = findMatches().length > 0;
        swapTmp([r,c],[r+1,c]);
        if(ok) return true;
      }
    }
  }
  return false;
}

function shuffleBoard(){
  const tiles = [];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(board[r][c]) tiles.push(board[r][c]);
    }
  }
  if(tiles.length < 3) return;
  let tries = 0;
  do {
    const colors = tiles.map(t => t.color);
    for(let i=colors.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [colors[i],colors[j]] = [colors[j],colors[i]];
    }
    tiles.forEach((t,i)=>{ t.color = colors[i]; });
    tries++;
  } while(!hasMoves() && tries < 200);
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  const w = window.innerWidth;
  const h = window.innerHeight - 60;

  // 背景渐变（少女粉）
  const bgGrad = ctx.createRadialGradient(w/2, h/2, 60, w/2, h/2, Math.max(w,h)*0.85);
  bgGrad.addColorStop(0, '#fff6fb');
  bgGrad.addColorStop(0.6, '#ffe4f0');
  bgGrad.addColorStop(1, '#ffd0e4');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,w,h);

  // 星星
  ctx.save();
  for(let i=0;i<stars.length;i++){
    const s = stars[i];
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // 棋盘外框（艺术少女风）
  const boardW = cellSize * COLS;
  const boardH = cellSize * ROWS;
  const pad = 14;
  const bx = offsetX - pad;
  const by = offsetY - pad;
  const bw = boardW + pad*2;
  const bh = boardH + pad*2;
  const br = 26;

  // 柔和光晕
  ctx.save();
  ctx.shadowColor = 'rgba(255, 145, 190, 0.55)';
  ctx.shadowBlur = 28;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  roundRectPath(bx, by, bw, bh, br);
  ctx.fill();
  ctx.restore();

  // 内部浅色底
  ctx.save();
  ctx.fillStyle = 'rgba(255,245,250,0.95)';
  roundRectPath(bx+2, by+2, bw-4, bh-4, br-2);
  ctx.fill();
  ctx.restore();

  // 渐变边框
  const borderGrad = ctx.createLinearGradient(bx, by, bx+bw, by+bh);
  borderGrad.addColorStop(0, '#ff9ec7');
  borderGrad.addColorStop(0.35, '#ffc4dd');
  borderGrad.addColorStop(0.7, '#cfa8ff');
  borderGrad.addColorStop(1, '#ff8fb8');
  ctx.save();
  ctx.strokeStyle = borderGrad;
  ctx.lineWidth = 3;
  roundRectPath(bx, by, bw, bh, br);
  ctx.stroke();
  ctx.restore();

  // 内格底纹
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#ffe0ee';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x = offsetX + c*cellSize + cellSize*0.08;
      const y = offsetY + r*cellSize + cellSize*0.08;
      roundRectPath(x, y, cellSize*0.84, cellSize*0.84, cellSize*0.2);
      ctx.fill();
    }
  }
  ctx.restore();

  // 棋盘裁剪区
  ctx.save();
  ctx.beginPath();
  ctx.rect(offsetX, offsetY, boardW, boardH);
  ctx.clip();

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t = board[r][c];
      if(!t) continue;
      const cx = offsetX + (t.displayCol + 0.5) * cellSize;
      const cy = offsetY + (t.displayRow + 0.5) * cellSize;
      drawTileShape(cx, cy, cellSize, t, selected && selected.tile === t);
    }
  }
  ctx.restore();

  // 礼花粒子
  if(fireworksActive && particles.length){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.spin;
      p.life -= p.decay;
      if(p.life <= 0 || p.y > h + 50){
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    }
  }
}

function drawTileShape(cx, cy, size, tile, isSelected){
  const base = size * 0.84;
  const clearP = tile.clearProgress || 0;
  const finalScale = (tile.scale || 1) * (1 - clearP);
  const alpha = 1 - clearP * 0.9;
  const rotation = clearP * Math.PI * 0.5;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.scale(Math.max(0.001, finalScale), Math.max(0.001, finalScale));
  ctx.globalAlpha = alpha;

  const half = base / 2;
  const radius = base * 0.22;

  // 阴影
  ctx.fillStyle = 'rgba(200,120,160,0.18)';
  roundRectPath(-half + 2, -half + 3, base, base, radius);
  ctx.fill();

  // 主色
  ctx.fillStyle = COLORS[tile.color];
  roundRectPath(-half, -half, base, base, radius);
  ctx.fill();

  // 顶部高光（半透明白）
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRectPath(-half + base*0.1, -half + base*0.08, base*0.55, base*0.28, base*0.14);
  ctx.fill();

  // 底部微光
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  roundRectPath(-half + base*0.2, half - base*0.22, base*0.6, base*0.12, base*0.08);
  ctx.fill();

  if(isSelected){
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 10;
    roundRectPath(-half, -half, base, base, radius);
    ctx.stroke();
  }
  ctx.restore();
}

function playClearAnimation(matches){
  return new Promise(resolve => {
    const duration = 280;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      matches.forEach(([r,c]) => {
        const tile = board[r][c];
        if(tile) tile.clearProgress = e;
      });
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        matches.forEach(([r,c]) => { board[r][c] = null; });
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function playFallAnimation(falls){
  if(!falls.length) return Promise.resolve();
  const maxDist = Math.max(...falls.map(f => Math.abs(f.to - f.from)));
  const duration = 180 + maxDist * 60;
  return new Promise(resolve => {
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      falls.forEach(f => {
        f.tile.displayRow = f.from + (f.to - f.from) * e;
      });
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        falls.forEach(f => { f.tile.displayRow = f.to; });
        draw();
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function animateSwap(tileA, aFrom, aTo, tileB, bFrom, bTo, duration){
  return new Promise(resolve => {
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      tileA.displayRow = aFrom.row + (aTo.row - aFrom.row) * e;
      tileA.displayCol = aFrom.col + (aTo.col - aFrom.col) * e;
      tileB.displayRow = bFrom.row + (bTo.row - bFrom.row) * e;
      tileB.displayCol = bFrom.col + (bTo.col - bFrom.col) * e;
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        tileA.displayRow = aTo.row; tileA.displayCol = aTo.col;
        tileB.displayRow = bTo.row; tileB.displayCol = bTo.col;
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

async function processMatches(){
  let chain = 0;
  while(true){
    const matches = findMatches();
    if(!matches.length) break;
    chain++;
    playMatchSound(chain);

    const gain = matches.length * 10 * chain;
    score += gain;
    updateHUD();

    await playClearAnimation(matches);
    const falls = applyGravity();
    await playFallAnimation(falls);
  }
}

async function trySwap(aR, aC, bR, bC){
  if(gameOver) return;
  busy = true;
  const aTile = board[aR][aC];
  const bTile = board[bR][bC];

  const aFrom = { row: aTile.displayRow, col: aTile.displayCol };
  const bFrom = { row: bTile.displayRow, col: bTile.displayCol };
  const aTo = { row: bR, col: bC };
  const bTo = { row: aR, col: aC };

  board[aR][aC] = bTile;
  board[bR][bC] = aTile;
  aTile.row = bR; aTile.col = bC;
  bTile.row = aR; bTile.col = aC;

  await animateSwap(aTile, aFrom, aTo, bTile, bFrom, bTo, 180);
  playSwapSound();

  const matches = findMatches();
  if(!matches.length){
    board[aR][aC] = aTile;
    board[bR][bC] = bTile;
    const aBack = { row: aTile.displayRow, col: aTile.displayCol };
    const bBack = { row: bTile.displayRow, col: bTile.displayCol };
    await animateSwap(aTile, aBack, { row: aR, col: aC },
                      bTile, bBack, { row: bR, col: bC }, 180);
    aTile.row = aR; aTile.col = aC;
    bTile.row = bR; bTile.col = bC;
    busy = false;
    draw();
    return;
  }

  moves--;
  updateHUD();
  await processMatches();

  const remaining = countRemaining();

  if(remaining === 0){
    busy = false;
    checkEnd();
    return;
  }

  if(!hasMoves()){
    playShuffleSound();
    shuffleBoard();
    draw();
    await new Promise(r => setTimeout(r, 300));
  }

  busy = false;
  draw();
  checkEnd();
}

function handleTap(e){
  if(e.cancelable) e.preventDefault();
  unlockAudio();
  if(busy || gameOver) return;

  const point = e.touches ? e.touches[0] : e;
  const px = point.clientX;
  const py = point.clientY - 60;

  const c = Math.floor((px - offsetX) / cellSize);
  const r = Math.floor((py - offsetY) / cellSize);
  if(r<0||r>=ROWS||c<0||c>=COLS) return;
  if(!board[r][c]) return;

  if(!selected){
    selected = { tile: board[r][c], r, c };
    draw();
    return;
  }

  if(selected.r === r && selected.c === c){
    selected = null;
    draw();
    return;
  }

  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  const prevR = selected.r, prevC = selected.c;
  selected = null;

  if(dr + dc === 1){
    trySwap(prevR, prevC, r, c);
  } else {
    selected = { tile: board[r][c], r, c };
    draw();
  }
}

canvas.addEventListener('touchstart', handleTap, {passive:false});
canvas.addEventListener('mousedown', handleTap);

function updateHUD(){
  const { stage, layer } = getCultivationTitle(level);
  document.getElementById('level').textContent = '第 ' + level + ' 关' + (isBossLevel(level) ? ' 🔥' : '');
  document.getElementById('title').textContent = stage + ' · 第 ' + layer + ' 层';
  document.getElementById('time').textContent = '⏱ ' + Math.ceil(timeLeft) + 's';
  document.getElementById('remaining').textContent = '剩 ' + countRemaining();
  document.getElementById('score').textContent = '分 ' + score;
}

// ===== 倒计时 =====
function startTimer(){
  stopTimer();
  timerId = setInterval(()=>{
    if(gameOver) return;
    timeLeft -= 0.1;
    if(timeLeft <= 0){
      timeLeft = 0;
      updateHUD();
      stopTimer();
      onTimeUp();
      return;
    }
    updateHUD();
  }, 100);
}

function stopTimer(){
  if(timerId) clearInterval(timerId);
  timerId = null;
}

function onTimeUp(){
  if(gameOver) return;
  gameOver = true;
  stopBGM();
  playLoseSound();
  const remaining = countRemaining();
  showOverlay(
    '时间到 ⏰',
    '还剩 ' + remaining + ' 块没消完\n再来一次吧～',
    '重玩本关',
    ()=>{
      startLevel();
      startBGM();
    }
  );
}

function checkEnd(){
  if(gameOver) return;
  const remaining = countRemaining();

  if(remaining === 0){
    gameOver = true;
    stopTimer();
    stopBGM();
    playWinSound();
    startFireworks();

    const { stage, layer } = getCultivationTitle(level);
    const reward = getWinReward(level);
    const bossText = isBossLevel(level) ? '\n🌟 境界突破！' : '';

    setTimeout(()=>{
      showOverlay(
        '恭喜我家媛儿姐\n突破 ' + stage + ' · 第 ' + layer + ' 层！' + bossText,
        reward + '\n得分 ' + score,
        '继续修行',
        ()=>{
          stopFireworks();
          level++;
          if(level > 30){
            startFireworks();
            showOverlay(
              '恭喜我家媛儿姐\n元婴期 · 大成！',
              '三十关全部通关\n一步登仙，羽化飞升 🌸',
              '重新开始',
              ()=>{
                stopFireworks();
                level = 1;
                startLevel();
                startBGM();
              }
            );
            return;
          }
          startLevel();
          startBGM();
        }
      );
    }, 900);

  } else if(moves <= 0){
    gameOver = true;
    stopTimer();
    stopBGM();
    playLoseSound();
    showOverlay(
      '步数用完',
      '还剩 ' + remaining + ' 块没消完\n再来一次吧～',
      '重玩本关',
      ()=>{
        startLevel();
        startBGM();
      }
    );
  }
}

function showOverlay(title, desc, btn, cb){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-desc').textContent = desc;
  const b = document.getElementById('ov-btn');
  b.textContent = btn;
  b.onclick = ()=>{ hideOverlay(); cb(); };
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay(){
  document.getElementById('overlay').classList.add('hidden');
  stopFireworks();
}

function startLevel(){
  const cfg = getLevelConfig(level);
  timeLeft = cfg.time;
  moves = cfg.moves;
  score = 0;
  selected = null;
  busy = false;
  gameOver = false;
  COLORS = cfg.boss ? COLORS_BOSS : COLORS_NORMAL;
  initBoard();
  updateHUD();
  resize();
  startTimer();
}

// ===== 礼花粒子 =====
const FW_COLORS = ['#ff9ec7','#ffd86b','#8ee8b0','#8ec5ff','#ffb87a','#cfa8ff','#ff6ba5','#fff2a8'];

function startFireworks(){
  particles = [];
  fireworksActive = true;
  let count = 0;
  const totalShows = 14;
  const interval = setInterval(()=>{
    const w = window.innerWidth;
    const h = window.innerHeight;
    const x = w * (0.15 + Math.random() * 0.7);
    const y = h * (0.12 + Math.random() * 0.4);
    spawnFirework(x, y);
    count++;
    if(count >= totalShows) clearInterval(interval);
  }, 260);
  spawnFirework(window.innerWidth * 0.5, window.innerHeight * 0.32);
  if(!fireworksActive) return;
  requestAnimationFrame(updateFireworks);
}

function spawnFirework(cx, cy){
  const count = 45 + Math.floor(Math.random() * 30);
  for(let i=0;i<count;i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5.5;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.011 + Math.random() * 0.012,
      size: 3 + Math.random() * 4,
      color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
      gravity: 0.08,
      spin: (Math.random() - 0.5) * 0.3,
      rot: Math.random() * Math.PI * 2
    });
  }
}

function updateFireworks(){
  if(!fireworksActive) return;
  draw();
  if(particles.length > 0){
    requestAnimationFrame(updateFireworks);
  }
}

function stopFireworks(){
  fireworksActive = false;
  particles = [];
  draw();
}

window.addEventListener('load', ()=>{
  startLevel();
  setTimeout(resize, 100);
});
</script>
