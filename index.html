<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="消消乐">
<title>消消乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#ffeef5;font-family:-apple-system,"PingFang SC",sans-serif;user-select:none}
  #topbar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-around;align-items:center;background:#ff6b9d;color:#fff;font-size:14px;font-weight:600;z-index:5}
  #board{position:fixed;top:44px;left:0;right:0;bottom:0;display:block}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10}
  #overlay.hidden{display:none}
  #overlay-content{background:#fff;border-radius:22px;padding:28px 32px;text-align:center;min-width:260px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  #overlay-content h2{margin-bottom:14px;color:#ff6b9d;font-size:22px;line-height:1.4}
  #overlay-content p{margin-bottom:18px;color:#555;font-size:15px}
  #overlay-content button{background:#ff6b9d;color:#fff;border:none;border-radius:12px;padding:12px 32px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div id="topbar">
  <div id="level">第 1 关</div>
  <div id="target">目标：1000</div>
  <div id="moves">步数：25</div>
  <div id="score">分数：0</div>
</div>
<canvas id="board"></canvas>
<div id="overlay" class="hidden">
  <div id="overlay-content">
    <h2 id="ov-title">恭喜！</h2>
    <p id="ov-desc"></p>
    <button id="ov-btn">继续</button>
  </div>
</div>
<script>
// ===== 音效引擎 =====
let audioCtx = null;
let audioUnlocked = false;

function unlockAudio(){
  if(audioUnlocked) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioUnlocked = true;
    startBGM();
  }catch(e){}
}

function playTone(freq, duration, type='sine', volume=0.15, when=0){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}

function playMatchSound(chain){
  const freq = 520 + (chain-1) * 120;
  playTone(freq, 0.15, 'sine', 0.18);
  playTone(freq*1.5, 0.12, 'sine', 0.12, 0.06);
}
function playSwapSound(){ playTone(400, 0.08, 'triangle', 0.1); }
function playWinSound(){
  playTone(523, 0.15, 'sine', 0.2);
  playTone(659, 0.15, 'sine', 0.2, 0.13);
  playTone(784, 0.25, 'sine', 0.2, 0.26);
  playTone(1046, 0.35, 'sine', 0.18, 0.42);
}
function playLoseSound(){
  playTone(300, 0.2, 'sawtooth', 0.12);
  playTone(200, 0.3, 'sawtooth', 0.12, 0.15);
}

// ===== 3 段不同的背景音乐 =====
const BGM_TRACKS = [
  [523,587,659,784,659,587,523,440,494,523,587,659,587,523,494,440],
  [440,494,523,587,659,587,523,494,440,392,440,494,523,494,440,392],
  [659,659,784,659,523,523,587,523,659,784,880,784,659,587,523,587]
];
const BGM_TEMPOS = [380, 440, 320];

let bgmTimer = null;
let bgmPlaying = false;
let bgmTrackIndex = 0;

function startBGM(){
  if(bgmPlaying || !audioCtx) return;
  bgmPlaying = true;
  bgmTrackIndex = (level - 1) % BGM_TRACKS.length;
  const notes = BGM_TRACKS[bgmTrackIndex];
  const tempo = BGM_TEMPOS[bgmTrackIndex];
  let i = 0;
  function tick(){
    if(!bgmPlaying) return;
    const note = notes[i % notes.length];
    playTone(note, tempo/1000 * 0.9, 'sine', 0.06);
    playTone(note/2, tempo/1000 * 0.9, 'triangle', 0.03);
    i++;
    bgmTimer = setTimeout(tick, tempo);
  }
  tick();
}

function stopBGM(){
  bgmPlaying = false;
  if(bgmTimer) clearTimeout(bgmTimer);
  bgmTimer = null;
}

// ===== 游戏主体 =====
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const COLS = 8, ROWS = 8;
const COLORS = ['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#ff9f45','#c780fa'];

let board = [];
let cellSize = 0;
let offsetX = 0, offsetY = 0;
let selected = null;
let score = 0, moves = 25, level = 1, target = 1000;
let busy = false;
let particles = [];
let fireworksActive = false;

function getLevelConfig(lv){
  const t = Math.floor(1000 + (lv-1)*250 + Math.pow(lv,1.6)*30);
  const m = Math.max(12, 25 - Math.floor((lv-1)/2));
  return { target: t, moves: m };
}

function easeOutQuad(t){ return 1 - (1-t)*(1-t); }
function randColor(){ return Math.floor(Math.random()*COLORS.length); }

// === 关键修复：用 JS 精确计算 canvas 尺寸 ===
function resize(){
  const topH = 44;
  const w = window.innerWidth;
  const h = window.innerHeight - topH;

  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.top = topH + 'px';

  canvas.width = Math.floor(w * devicePixelRatio);
  canvas.height = Math.floor(h * devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  cellSize = Math.floor(Math.min((w - 8) / COLS, (h - 8) / ROWS));
  offsetX = (w - cellSize * COLS) / 2;
  offsetY = (h - cellSize * ROWS) / 2;

  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 300));

function makeTile(color, row, col, startRow){
  return {
    color,
    row,
    col,
    displayRow: startRow !== undefined ? startRow : row,
    displayCol: col,
    scale: 1,
    clearProgress: 0
  };
}

function initBoard(){
  board = [];
  for(let r=0;r<ROWS;r++){
    board[r] = [];
    for(let c=0;c<COLS;c++){
      let color;
      let tries = 0;
      do {
        color = randColor();
        tries++;
      } while (tries < 50 && (
        (c >= 2 && board[r][c-1] && board[r][c-2] &&
         board[r][c-1].color === color && board[r][c-2].color === color) ||
        (r >= 2 && board[r-1][c] && board[r-2][c] &&
         board[r-1][c].color === color && board[r-2][c].color === color)
      ));
      board[r][c] = makeTile(color, r, c);
    }
  }
}

function findMatches(){
  const marks = new Set();
  for(let r=0;r<ROWS;r++){
    let run = 1;
    for(let c=1;c<=COLS;c++){
      const curr = c < COLS ? board[r][c] : null;
      const prev = board[r][c-1];
      if(curr && prev && curr.color === prev.color) run++;
      else {
        if(run >= 3) for(let k=c-run;k<c;k++) marks.add(r+','+k);
        run = 1;
      }
    }
  }
  for(let c=0;c<COLS;c++){
    let run = 1;
    for(let r=1;r<=ROWS;r++){
      const curr = r < ROWS ? board[r][c] : null;
      const prev = board[r-1][c];
      if(curr && prev && curr.color === prev.color) run++;
      else {
        if(run >= 3) for(let k=r-run;k<r;k++) marks.add(k+','+c);
        run = 1;
      }
    }
  }
  return [...marks].map(s => s.split(',').map(Number));
}

function applyGravity(){
  const falls = [];
  for(let c=0;c<COLS;c++){
    let writeRow = ROWS - 1;
    for(let r=ROWS-1;r>=0;r--){
      const t = board[r][c];
      if(t){
        if(r !== writeRow){
          board[writeRow][c] = t;
          board[r][c] = null;
          t.row = writeRow;
          falls.push({ tile: t, from: t.displayRow, to: writeRow });
        }
        writeRow--;
      }
    }
    for(let r=writeRow;r>=0;r--){
      const newTile = makeTile(randColor(), r, c);
      newTile.displayRow = r - (writeRow + 1);
      board[r][c] = newTile;
      falls.push({ tile: newTile, from: newTile.displayRow, to: r });
    }
  }
  return falls;
}

function draw(){
  const w = window.innerWidth;
  const h = window.innerHeight - 44;
  ctx.fillStyle = '#ffeef5';
  ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.beginPath();
  ctx.rect(offsetX, offsetY, cellSize*COLS, cellSize*ROWS);
  ctx.clip();

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t = board[r][c];
      if(!t) continue;
      const cx = offsetX + (t.displayCol + 0.5) * cellSize;
      const cy = offsetY + (t.displayRow + 0.5) * cellSize;
      drawTileShape(cx, cy, cellSize, t, selected && selected.tile === t);
    }
  }
  ctx.restore();

  if(fireworksActive && particles.length){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.spin;
      p.life -= p.decay;
      if(p.life <= 0 || p.y > h + 50){
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    }
  }
}

function drawTileShape(cx, cy, size, tile, isSelected){
  const base = size * 0.84;
  const clearP = tile.clearProgress || 0;
  const finalScale = (tile.scale || 1) * (1 - clearP);
  const alpha = 1 - clearP * 0.9;
  const rotation = clearP * Math.PI * 0.5;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.scale(Math.max(0.001, finalScale), Math.max(0.001, finalScale));
  ctx.globalAlpha = alpha;

  const half = base / 2;
  const radius = base * 0.18;

  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  roundRectPath(-half + 2, -half + 3, base, base, radius);
  ctx.fill();

  ctx.fillStyle = COLORS[tile.color];
  roundRectPath(-half, -half, base, base, radius);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRectPath(-half + base*0.12, -half + base*0.10, base*0.5, base*0.28, base*0.14);
  ctx.fill();

  if(isSelected){
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    roundRectPath(-half, -half, base, base, radius);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function playClearAnimation(matches){
  return new Promise(resolve => {
    const duration = 280;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      matches.forEach(([r,c]) => {
        const tile = board[r][c];
        if(tile) tile.clearProgress = e;
      });
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        matches.forEach(([r,c]) => { board[r][c] = null; });
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function playFallAnimation(falls){
  if(!falls.length) return Promise.resolve();
  const maxDist = Math.max(...falls.map(f => Math.abs(f.to - f.from)));
  const duration = 180 + maxDist * 60;
  return new Promise(resolve => {
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      falls.forEach(f => {
        f.tile.displayRow = f.from + (f.to - f.from) * e;
      });
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        falls.forEach(f => { f.tile.displayRow = f.to; });
        draw();
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function animateSwap(tileA, aFrom, aTo, tileB, bFrom, bTo, duration){
  return new Promise(resolve => {
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutQuad(t);
      tileA.displayRow = aFrom.row + (aTo.row - aFrom.row) * e;
      tileA.displayCol = aFrom.col + (aTo.col - aFrom.col) * e;
      tileB.displayRow = bFrom.row + (bTo.row - bFrom.row) * e;
      tileB.displayCol = bFrom.col + (bTo.col - bFrom.col) * e;
      draw();
      if(t < 1) requestAnimationFrame(step);
      else {
        tileA.displayRow = aTo.row; tileA.displayCol = aTo.col;
        tileB.displayRow = bTo.row; tileB.displayCol = bTo.col;
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

async function processMatches(){
  let chain = 0;
  while(true){
    const matches = findMatches();
    if(!matches.length) break;
    chain++;
    playMatchSound(chain);

    const gain = matches.length * 10 * chain;
    score += gain;
    updateHUD();

    await playClearAnimation(matches);
    const falls = applyGravity();
    await playFallAnimation(falls);
  }
}

async function trySwap(aR, aC, bR, bC){
  busy = true;
  const aTile = board[aR][aC];
  const bTile = board[bR][bC];

  const aFrom = { row: aTile.displayRow, col: aTile.displayCol };
  const bFrom = { row: bTile.displayRow, col: bTile.displayCol };
  const aTo = { row: bR, col: bC };
  const bTo = { row: aR, col: aC };

  board[aR][aC] = bTile;
  board[bR][bC] = aTile;
  aTile.row = bR; aTile.col = bC;
  bTile.row = aR; bTile.col = aC;

  await animateSwap(aTile, aFrom, aTo, bTile, bFrom, bTo, 180);
  playSwapSound();

  const matches = findMatches();
  if(!matches.length){
    board[aR][aC] = aTile;
    board[bR][bC] = bTile;
    const aBack = { row: aTile.displayRow, col: aTile.displayCol };
    const bBack = { row: bTile.displayRow, col: bTile.displayCol };
    await animateSwap(aTile, aBack, { row: aR, col: aC },
                      bTile, bBack, { row: bR, col: bC }, 180);
    aTile.row = aR; aTile.col = aC;
    bTile.row = bR; bTile.col = bC;
    busy = false;
    draw();
    return;
  }

  moves--;
  updateHUD();
  await processMatches();
  busy = false;
  draw();
  checkEnd();
}

function handleTap(e){
  if(e.cancelable) e.preventDefault();
  unlockAudio();
  if(busy) return;

  const point = e.touches ? e.touches[0] : e;
  const px = point.clientX;
  const py = point.clientY - 44;

  const c = Math.floor((px - offsetX) / cellSize);
  const r = Math.floor((py - offsetY) / cellSize);
  if(r<0||r>=ROWS||c<0||c>=COLS) return;
  if(!board[r][c]) return;

  if(!selected){
    selected = { tile: board[r][c], r, c };
    draw();
    return;
  }

  if(selected.r === r && selected.c === c){
    selected = null;
    draw();
    return;
  }

  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  const prevR = selected.r, prevC = selected.c;
  selected = null;

  if(dr + dc === 1){
    trySwap(prevR, prevC, r, c);
  } else {
    selected = { tile: board[r][c], r, c };
    draw();
  }
}

canvas.addEventListener('touchstart', handleTap, {passive:false});
canvas.addEventListener('mousedown', handleTap);

function updateHUD(){
  document.getElementById('level').textContent = '第 ' + level + ' 关';
  document.getElementById('target').textContent = '目标：' + target;
  document.getElementById('moves').textContent = '步数：' + moves;
  document.getElementById('score').textContent = '分数：' + score;
}

function checkEnd(){
  if(score >= target){
    stopBGM();
    playWinSound();
    startFireworks();
    showOverlay('恭喜我家媛儿姐通关！','得分 '+score+'，进入第 '+(level+1)+' 关','继续', ()=>{
      stopFireworks();
      level++;
      if(level > 30){
        startFireworks();
        showOverlay('恭喜我家媛儿姐通关！','你已完成全部 30 关！','重玩', ()=>{
          stopFireworks();
          level = 1;
          startLevel();
          startBGM();
        });
        return;
      }
      startLevel();
      startBGM();
    });
  } else if(moves <= 0){
    stopBGM();
    playLoseSound();
    showOverlay('步数用完','得分 '+score+'，未达目标 '+target,'重玩本关', ()=>{
      startLevel();
      startBGM();
    });
  }
}

function showOverlay(title, desc, btn, cb){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-desc').textContent = desc;
  const b = document.getElementById('ov-btn');
  b.textContent = btn;
  b.onclick = ()=>{ hideOverlay(); cb(); };
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay(){
  document.getElementById('overlay').classList.add('hidden');
  stopFireworks();
}

function startLevel(){
  const cfg = getLevelConfig(level);
  target = cfg.target;
  moves = cfg.moves;
  score = 0;
  selected = null;
  busy = false;
  initBoard();
  updateHUD();
  resize();
}

// ===== 礼花粒子 =====
const FW_COLORS = ['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#ff9f45','#c780fa','#ff4d6d','#4dd0e1'];

function startFireworks(){
  particles = [];
  fireworksActive = true;
  let count = 0;
  const totalShows = 12;
  const interval = setInterval(()=>{
    const w = window.innerWidth;
    const h = window.innerHeight;
    const x = w * (0.15 + Math.random() * 0.7);
    const y = h * (0.15 + Math.random() * 0.4);
    spawnFirework(x, y);
    count++;
    if(count >= totalShows) clearInterval(interval);
  }, 280);
  spawnFirework(window.innerWidth * 0.5, window.innerHeight * 0.35);
  if(!fireworksActive) return;
  requestAnimationFrame(updateFireworks);
}

function spawnFirework(cx, cy){
  const count = 40 + Math.floor(Math.random() * 30);
  for(let i=0;i<count;i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.012 + Math.random() * 0.012,
      size: 3 + Math.random() * 4,
      color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
      gravity: 0.08,
      spin: (Math.random() - 0.5) * 0.3,
      rot: Math.random() * Math.PI * 2
    });
  }
}

function updateFireworks(){
  if(!fireworksActive) return;
  draw();
  if(particles.length > 0){
    requestAnimationFrame(updateFireworks);
  }
}

function stopFireworks(){
  fireworksActive = false;
  particles = [];
  draw();
}

// 启动
window.addEventListener('load', ()=>{
  startLevel();
  setTimeout(resize, 100);
});
</script>
</body>
</html>
